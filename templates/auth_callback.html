<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Verifying Account...</title>
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='branding/favicon.svg') }}">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
    <style>
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f6f8fb;
            color: #1f2937;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .card {
            background: white;
            width: 92%;
            max-width: 520px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            padding: 28px;
            text-align: center;
        }
        .brand-logo {
            width: 160px;
            height: 34px;
            display: block;
            margin: 0 auto 14px;
            object-fit: contain;
        }
        h1 {
            margin: 0 0 10px;
            font-size: 22px;
        }
        p {
            margin: 0;
            color: #4b5563;
            line-height: 1.5;
        }
        .ok {
            color: #166534;
        }
        .err {
            color: #991b1b;
        }
        .hint {
            margin-top: 14px;
            font-size: 13px;
            color: #6b7280;
        }
        a {
            color: #2563eb;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="card">
        <img class="brand-logo" src="{{ url_for('static', filename='branding/velank-logo-dark.svg') }}" alt="Velank logo">
        <h1 id="title">Verifying your account...</h1>
        <p id="message">Please wait while we finish your sign-in.</p>
        <p class="hint">If this takes too long, <a href="/login">go to login</a>.</p>
    </div>

    <script>
        (function () {
            // ── Supabase JS SDK handles PKCE code exchange AND implicit token
            // extraction from the URL hash, covering all Supabase auth flows. ──

            const titleEl = document.getElementById('title');
            const messageEl = document.getElementById('message');

            const SUPABASE_URL  = '{{ supabase_url }}';
            const SUPABASE_ANON = '{{ supabase_anon_key }}';

            function showError(title, msg) {
                titleEl.className = 'err';
                titleEl.textContent = title || 'Sign-in could not be completed';
                messageEl.textContent = msg || 'Please try again.';
            }

            function clearAuthStorage() {
                ['access_token', 'refresh_token', 'user_id', 'user_email',
                 'first_name', 'last_name', 'country', 'auth_just_signed_in_at',
                 'token_type']
                    .forEach(function (k) { localStorage.removeItem(k); });
            }

            // ── 1. Check for Supabase-level OAuth errors in the URL ──────────
            const hashParams  = new URLSearchParams(window.location.hash.replace(/^#/, ''));
            const queryParams = new URLSearchParams(window.location.search || '');
            const oauthError  = hashParams.get('error_description') || queryParams.get('error_description')
                             || hashParams.get('error') || queryParams.get('error');
            if (oauthError) {
                clearAuthStorage();
                showError('Google sign-in failed', String(oauthError).replace(/\+/g, ' ').trim());
                setTimeout(function () {
                    window.location.replace('/login#oauth_error=' + encodeURIComponent(String(oauthError)));
                }, 1400);
                return;
            }

            // ── 2. Use Supabase SDK to get/exchange the session ──────────────
            if (!SUPABASE_URL || !SUPABASE_ANON || SUPABASE_URL === 'None' || SUPABASE_ANON === 'None') {
                showError('Configuration error', 'Server is missing Supabase credentials. Contact support.');
                return;
            }

            (async function () {
                try {
                    // createClient with detectSessionInUrl:true (default) makes
                    // getSession() automatically exchange a PKCE ?code= or read
                    // an implicit #access_token= from the current URL.
                    const sbClient = supabase.createClient(SUPABASE_URL, SUPABASE_ANON, {
                        auth: {
                            persistSession: false,   // we manage our own storage
                            detectSessionInUrl: true,
                            autoRefreshToken: false
                        }
                    });

                    titleEl.className = 'ok';
                    titleEl.textContent = 'Completing sign-in...';
                    messageEl.textContent = 'Exchanging credentials. Please wait.';

                    const { data, error } = await sbClient.auth.getSession();

                    if (error || !data || !data.session) {
                        clearAuthStorage();
                        const errMsg = (error && error.message) ? error.message : 'No session was returned.';
                        showError('Sign-in could not be completed', errMsg + ' Please try again.');
                        return;
                    }

                    const session = data.session;
                    const accessToken  = session.access_token;
                    const refreshToken = session.refresh_token;
                    const user         = session.user || {};

                    // ── 3. Verify the token with our backend ─────────────────
                    const verifyResp = await fetch('/api/auth/verify-token', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({ token: accessToken })
                    });
                    const verifyData = await verifyResp.json().catch(function () { return {}; });

                    if (!verifyResp.ok || !verifyData.success) {
                        clearAuthStorage();
                        showError('Sign-in could not be completed',
                            'Your session was issued but could not be validated by the server. Please retry.');
                        return;
                    }

                    // ── 4. Persist session for our app ───────────────────────
                    localStorage.setItem('access_token',  accessToken);
                    if (refreshToken) localStorage.setItem('refresh_token', refreshToken);

                    const backendUser = verifyData.user || {};
                    const userId    = backendUser.id    || user.id    || '';
                    const userEmail = backendUser.email || user.email || '';
                    const meta      = user.user_metadata || {};
                    if (userId)    localStorage.setItem('user_id',    userId);
                    if (userEmail) localStorage.setItem('user_email', userEmail);
                    localStorage.setItem('first_name', backendUser.first_name || meta.first_name || meta.full_name || '');
                    localStorage.setItem('last_name',  backendUser.last_name  || meta.last_name  || '');
                    localStorage.setItem('country',    backendUser.country    || meta.country    || '');
                    localStorage.setItem('auth_just_signed_in_at', String(Date.now()));

                    titleEl.className = 'ok';
                    titleEl.textContent = 'Sign-in successful';
                    messageEl.textContent = 'Redirecting to dashboard...';

                    setTimeout(function () { window.location.replace('/'); }, 450);

                } catch (err) {
                    clearAuthStorage();
                    showError('Sign-in error', String(err && err.message ? err.message : err));
                }
            }());
    </script>
</body>
</html>
