<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Verifying Account...</title>
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='branding/favicon.svg') }}">
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;500;600;700;800&family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,400;0,9..40,500;0,9..40,600;1,9..40,300&display=swap" rel="stylesheet">
    <!-- No SDK needed: implicit flow delivers tokens directly in URL hash -->
    <style>
        :root {
            --primary: #667eea;
            --secondary: #764ba2;
            --success: #52c41a;
            --error: #f5222d;
            --warning: #faad14;
            --info: #1890ff;
            --light: #f0f2f5;
            --dark: #262626;
            --border: #d9d9d9;

            --bg-a: #eef2ff;
            --bg-b: #e5e7eb;
            --ink: #2c3e50;
            --muted: #4b5563;
            --brand: var(--primary);
            --brand-2: var(--secondary);
            --ok: #166534;
            --ok-soft: #dcfce7;
            --err: #991b1b;
            --err-soft: #fee2e2;
            --card: rgba(255, 255, 255, 0.88);
            --card-border: rgba(255, 255, 255, 0.7);
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Helvetica Neue', sans-serif;
            background:
                radial-gradient(1000px 500px at 10% 0%, rgba(102, 126, 234, 0.24), transparent 65%),
                radial-gradient(900px 450px at 100% 100%, rgba(16, 185, 129, 0.12), transparent 70%),
                linear-gradient(160deg, var(--bg-a), var(--bg-b));
            color: var(--ink);
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 24px;
        }

        .card {
            position: relative;
            overflow: hidden;
            background: var(--card);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border: 1px solid var(--card-border);
            width: min(760px, 100%);
            border-radius: 24px;
            box-shadow: 0 30px 80px rgba(17, 24, 39, 0.18);
            padding: 34px 34px 28px;
        }

        .card::before {
            content: '';
            position: absolute;
            inset: 0 auto auto 0;
            width: 100%;
            height: 6px;
            background: linear-gradient(90deg, var(--brand), var(--brand-2));
        }

        .brand-row {
            display: flex;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
        }

        .brand-logo {
            width: 34px;
            height: 34px;
            object-fit: contain;
        }

        .brand-name {
            font-size: 31px;
            font-weight: 900;
            letter-spacing: 0.01em;
            color: #1f2a44;
            line-height: 1;
            font-family: 'Syne', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Helvetica Neue', sans-serif;
        }

        .status-pill {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            border-radius: 999px;
            border: 1px solid #ddd6fe;
            background: #f5f3ff;
            color: #5b21b6;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            padding: 8px 12px;
            margin: 0;
        }

        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background: var(--brand);
            box-shadow: 0 0 0 0 rgba(124, 58, 237, 0.55);
            animation: pulse 1.8s infinite;
        }

        .title {
            margin: 14px 0 10px;
            font-size: clamp(28px, 4.2vw, 42px);
            line-height: 1.08;
            font-weight: 900;
            letter-spacing: -0.02em;
            color: #0f172a;
            font-family: 'Syne', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Helvetica Neue', sans-serif;
        }

        .subtitle {
            margin: 0;
            color: var(--muted);
            font-size: 23px;
            line-height: 1.55;
            max-width: 62ch;
            font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Helvetica Neue', sans-serif;
        }

        .progress-wrap {
            margin-top: 22px;
        }

        .progress-track {
            width: 100%;
            height: 10px;
            border-radius: 999px;
            background: #e5e7eb;
            overflow: hidden;
        }

        .progress-fill {
            width: 35%;
            height: 100%;
            border-radius: inherit;
            background: linear-gradient(90deg, var(--brand), var(--brand-2));
            transition: width 280ms ease;
        }

        .steps {
            margin: 14px 0 0;
            padding: 0;
            list-style: none;
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 10px;
        }

        .step {
            border-radius: 12px;
            border: 1px solid #e5e7eb;
            background: rgba(255, 255, 255, 0.78);
            padding: 10px 12px;
            font-size: 13px;
            color: #6b7280;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .step strong {
            color: #1f2937;
            font-weight: 700;
        }

        .step-icon {
            width: 9px;
            height: 9px;
            border-radius: 50%;
            background: #9ca3af;
            flex-shrink: 0;
        }

        .step.on .step-icon {
            background: var(--brand);
            box-shadow: 0 0 0 3px rgba(124, 58, 237, 0.16);
        }

        .hint {
            margin-top: 18px;
            font-size: 17px;
            color: #64748b;
            font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Helvetica Neue', sans-serif;
        }

        a {
            color: #2563eb;
            font-weight: 600;
            text-decoration: none;
        }

        body.state-success .status-pill {
            border-color: #86efac;
            background: var(--ok-soft);
            color: var(--ok);
        }

        body.state-success .status-dot {
            background: #16a34a;
            animation: none;
            box-shadow: 0 0 0 4px rgba(22, 163, 74, 0.18);
        }

        body.state-success .title {
            color: var(--ok);
        }

        body.state-success .progress-fill {
            width: 100%;
            background: linear-gradient(90deg, #16a34a, #059669);
        }

        body.state-success .step {
            border-color: #bbf7d0;
            background: #f0fdf4;
        }

        body.state-success .step .step-icon {
            background: #16a34a;
            box-shadow: none;
        }

        body.state-error .status-pill {
            border-color: #fecaca;
            background: var(--err-soft);
            color: var(--err);
        }

        body.state-error .status-dot {
            background: #dc2626;
            animation: none;
            box-shadow: 0 0 0 4px rgba(220, 38, 38, 0.15);
        }

        body.state-error .title {
            color: var(--err);
        }

        body.state-error .progress-fill {
            width: 100%;
            background: linear-gradient(90deg, #dc2626, #b91c1c);
        }

        body.state-error .step {
            border-color: #fecaca;
            background: #fef2f2;
        }

        body.state-error .step .step-icon {
            background: #dc2626;
            box-shadow: none;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(124, 58, 237, 0.55); }
            70% { box-shadow: 0 0 0 10px rgba(124, 58, 237, 0); }
            100% { box-shadow: 0 0 0 0 rgba(124, 58, 237, 0); }
        }

        @media (max-width: 640px) {
            .card {
                border-radius: 18px;
                padding: 24px 18px 20px;
            }
            .steps {
                grid-template-columns: 1fr;
            }
        }
    </style>
</head>
<body>
    <div class="card">
        <div class="brand-row">
            <img class="brand-logo" src="{{ url_for('static', filename='branding/velank-logo-dark.svg') }}" alt="Velank logo">
            <div class="brand-name">Velank AI</div>
        </div>

        <div class="status-pill"><span class="status-dot"></span><span id="stageBadge">Securing session</span></div>
        <h1 id="title" class="title">Completing sign-in...</h1>
        <p id="message" class="subtitle">Validating your session and preparing your workspace.</p>

        <div class="progress-wrap">
            <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
            <ul class="steps">
                <li class="step on" id="st1"><span class="step-icon"></span><strong>Session verified</strong></li>
                <li class="step" id="st2"><span class="step-icon"></span><strong>Redirecting to dashboard</strong></li>
            </ul>
        </div>

        <p class="hint">If this takes too long, <a href="/login">go to login</a>.</p>
    </div>

    <script>
        (function () {
            var titleEl = document.getElementById('title');
            var messageEl = document.getElementById('message');
            var stageBadgeEl = document.getElementById('stageBadge');
            var progressFillEl = document.getElementById('progressFill');
            var step1El = document.getElementById('st1');
            var step2El = document.getElementById('st2');
            var _tokenStore = sessionStorage;   // tokens in sessionStorage (XSS-safe)

            function setStage(mode, title, msg, badge, progress) {
                document.body.classList.remove('state-success', 'state-error');
                if (mode === 'success') document.body.classList.add('state-success');
                if (mode === 'error') document.body.classList.add('state-error');

                titleEl.textContent = title || '';
                messageEl.textContent = msg || '';
                if (stageBadgeEl) stageBadgeEl.textContent = badge || '';
                if (progressFillEl && typeof progress === 'number') progressFillEl.style.width = Math.max(0, Math.min(100, progress)) + '%';
                if (step1El) step1El.classList.add('on');
                if (step2El) step2El.classList.toggle('on', mode === 'success');
            }

            function showError(title, msg) {
                setStage('error', title || 'Sign-in could not be completed', msg || 'Please try again.', 'Action required', 100);
            }

            function clearAuthStorage() {
                _tokenStore.removeItem('access_token');
                _tokenStore.removeItem('refresh_token');
                ['user_id', 'user_email',
                 'first_name', 'last_name', 'country', 'auth_just_signed_in_at',
                 'token_type']
                    .forEach(function (k) { localStorage.removeItem(k); });
            }

            // ── Parse URL hash and query ──────────────────────────────────────
            var rawHash = window.location.hash || '';
            var hashStr = rawHash.replace(/^#/, '');
            var hashParams  = new URLSearchParams(hashStr);
            var queryParams = new URLSearchParams(window.location.search || '');

            // ── 1. Check for OAuth errors ────────────────────────────────────
            var oauthError = hashParams.get('error_description') || queryParams.get('error_description')
                          || hashParams.get('error') || queryParams.get('error');
            if (oauthError) {
                clearAuthStorage();
                showError('Google sign-in failed', String(oauthError).replace(/\+/g, ' ').trim());
                setTimeout(function () {
                    window.location.replace('/login#oauth_error=' + encodeURIComponent(String(oauthError)));
                }, 1400);
                return;
            }

            // ── 2. Extract tokens from URL hash (Supabase redirects with tokens) ───────
            // Supabase OAuth returns: #access_token=xxx&refresh_token=yyy&expires_in=3600&token_type=Bearer
            var accessToken  = hashParams.get('access_token')  || '';
            var refreshToken = hashParams.get('refresh_token') || '';
            var flowType = hashParams.get('type') || queryParams.get('type') || '';

            // Fallback: check query params in case Supabase uses ?param style
            if (!accessToken) {
                accessToken  = queryParams.get('access_token')  || '';
                refreshToken = queryParams.get('refresh_token') || '';
            }

            if (!accessToken) {
                clearAuthStorage();
                showError('Sign-in could not be completed',
                    'Session tokens not received from Supabase. Please try Google sign-in again.');
                return;
            }

            // ── 2b. Password recovery flow: redirect to reset screen instead of dashboard ─
            if (flowType === 'recovery') {
                setStage('success', 'Reset link verified', 'Redirecting you to set a new password...', 'Recovery validated', 100);

                var next = '/login?reset=recovery#access_token=' + encodeURIComponent(accessToken);
                if (refreshToken) next += '&refresh_token=' + encodeURIComponent(refreshToken);
                next += '&type=recovery';

                setTimeout(function () {
                    window.location.replace(next);
                }, 250);
                return;
            }

            // ── 3. Verify the token with our backend ─────────────────────────────
            setStage('loading', 'Completing sign-in...', 'Validating your session. Please wait.', 'Securing session', 56);

            fetch('/api/auth/verify-token', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ token: accessToken })
            })
            .then(function (resp) {
                return resp.json().then(function (body) {
                    return { ok: resp.ok, body: body };
                });
            })
            .then(function (result) {
                // If token verification succeeds, use the user data
                if (result.ok && result.body && result.body.success && result.body.user) {
                    var user = result.body.user || {};
                    
                    // ── 4. Decide whether to accept this OAuth sign-in ─
                    // ACCOUNT LINKING: Allow seamless authentication with different methods
                    // Users can sign in with email/password OR OAuth on the same account
                    
                    var acceptToken = function () {
                        // Accept token and store user info
                        _tokenStore.setItem('access_token', accessToken);
                        if (refreshToken) {
                            _tokenStore.setItem('refresh_token', refreshToken);
                        }

                        if (user.id)    localStorage.setItem('user_id',    user.id);
                        if (user.email) localStorage.setItem('user_email', user.email);
                        localStorage.setItem('first_name', user.first_name || '');
                        localStorage.setItem('last_name',  user.last_name  || '');
                        localStorage.setItem('country',    user.country    || '');
                        localStorage.setItem('auth_just_signed_in_at', String(Date.now()));

                        // ── 5. Hydrate profile from /api/auth/me then redirect ───────
                        fetch('/api/auth/me', {
                            headers: { 'Authorization': 'Bearer ' + accessToken }
                        })
                        .then(function (r) { return r.json().catch(function () { return {}; }); })
                        .then(function (meData) {
                            if (meData && meData.success && meData.user) {
                                var u = meData.user;
                                if (u.id)    localStorage.setItem('user_id',    u.id);
                                if (u.email) localStorage.setItem('user_email', u.email);
                                if (u.first_name) localStorage.setItem('first_name', u.first_name);
                                if (u.last_name)  localStorage.setItem('last_name',  u.last_name);
                                if (u.country)    localStorage.setItem('country',    u.country);
                            }
                        })
                        .catch(function () {})
                        .finally(function () {
                            setStage('success', 'Sign-in successful', 'Redirecting to dashboard...', 'Ready', 100);
                            setTimeout(function () { window.location.replace('/'); }, 400);
                        });
                    };
                    
                    // Allow login with any auth method - backend handles linking
                    acceptToken();
                } else {
                    // Token validation failed, but token might still be valid from Supabase
                    // Try to use the token anyway since we got it from Supabase's implicit flow
                    console.warn('Token verification failed but continuing with OAuth token:', result.body);
                    
                    // Store the token and redirect - let the dashboard handle any issues
                    _tokenStore.setItem('access_token', accessToken);
                    if (refreshToken) _tokenStore.setItem('refresh_token', refreshToken);
                    localStorage.setItem('auth_just_signed_in_at', String(Date.now()));

                    setStage('success', 'Sign-in successful', 'Redirecting to dashboard...', 'Ready', 100);
                    setTimeout(function () { window.location.replace('/'); }, 400);
                }
            })
            .catch(function (err) {
                console.error('Verification error:', err);
                // Even if verification fails, if we have a token from Supabase, try to use it
                if (accessToken) {
                    _tokenStore.setItem('access_token', accessToken);
                    if (refreshToken) _tokenStore.setItem('refresh_token', refreshToken);
                    localStorage.setItem('auth_just_signed_in_at', String(Date.now()));
                    
                    setStage('success', 'Sign-in successful', 'Redirecting to dashboard...', 'Ready', 100);
                    setTimeout(function () { window.location.replace('/'); }, 400);
                } else {
                    clearAuthStorage();
                    showError('Sign-in error', String(err && err.message ? err.message : err));
                }
            });
        })();
    </script>
</body>
</html>
