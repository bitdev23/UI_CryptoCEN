<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Verifying Account...</title>
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='branding/favicon.svg') }}">
    <!-- No SDK needed: implicit flow delivers tokens directly in URL hash -->
    <style>
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f6f8fb;
            color: #1f2937;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .card {
            background: white;
            width: 92%;
            max-width: 520px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            padding: 28px;
            text-align: center;
        }
        .brand-logo {
            width: 160px;
            height: 34px;
            display: block;
            margin: 0 auto 14px;
            object-fit: contain;
        }
        h1 {
            margin: 0 0 10px;
            font-size: 22px;
        }
        p {
            margin: 0;
            color: #4b5563;
            line-height: 1.5;
        }
        .ok {
            color: #166534;
        }
        .err {
            color: #991b1b;
        }
        .hint {
            margin-top: 14px;
            font-size: 13px;
            color: #6b7280;
        }
        a {
            color: #2563eb;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="card">
        <img class="brand-logo" src="{{ url_for('static', filename='branding/velank-logo-dark.svg') }}" alt="Velank logo">
        <h1 id="title">Verifying your account...</h1>
        <p id="message">Please wait while we finish your sign-in.</p>
        <p class="hint">If this takes too long, <a href="/login">go to login</a>.</p>
    </div>

    <script>
        (function () {
            var titleEl = document.getElementById('title');
            var messageEl = document.getElementById('message');

            function showError(title, msg) {
                titleEl.className = 'err';
                titleEl.textContent = title || 'Sign-in could not be completed';
                messageEl.textContent = msg || 'Please try again.';
            }

            function clearAuthStorage() {
                ['access_token', 'refresh_token', 'user_id', 'user_email',
                 'first_name', 'last_name', 'country', 'auth_just_signed_in_at',
                 'token_type']
                    .forEach(function (k) { localStorage.removeItem(k); });
            }

            // ── Parse URL hash and query ──────────────────────────────────────
            var rawHash = window.location.hash || '';
            var hashStr = rawHash.replace(/^#/, '');
            var hashParams  = new URLSearchParams(hashStr);
            var queryParams = new URLSearchParams(window.location.search || '');

            // ── 1. Check for OAuth errors ────────────────────────────────────
            var oauthError = hashParams.get('error_description') || queryParams.get('error_description')
                          || hashParams.get('error') || queryParams.get('error');
            if (oauthError) {
                clearAuthStorage();
                showError('Google sign-in failed', String(oauthError).replace(/\+/g, ' ').trim());
                setTimeout(function () {
                    window.location.replace('/login#oauth_error=' + encodeURIComponent(String(oauthError)));
                }, 1400);
                return;
            }

            // ── 2. Extract access_token from hash (implicit flow) ────────────
            var accessToken  = hashParams.get('access_token')  || queryParams.get('access_token')  || '';
            var refreshToken = hashParams.get('refresh_token') || queryParams.get('refresh_token') || '';

            if (!accessToken) {
                clearAuthStorage();
                showError('Sign-in could not be completed',
                    'No access token found in the callback URL. Please try Google sign-in again.');
                return;
            }

            // ── 3. Verify the token with our backend then redirect ────────────
            titleEl.className = 'ok';
            titleEl.textContent = 'Completing sign-in...';
            messageEl.textContent = 'Validating your session. Please wait.';

            fetch('/api/auth/verify-token', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ token: accessToken })
            })
            .then(function (resp) {
                return resp.json().then(function (body) {
                    return { ok: resp.ok, body: body };
                });
            })
            .then(function (result) {
                if (!result.ok || !result.body || !result.body.success) {
                    clearAuthStorage();
                    showError('Sign-in could not be completed',
                        'Session validation failed. Please try Google sign-in again.');
                    return;
                }

                // ── 4. Store tokens + user info ──────────────────────────────
                localStorage.setItem('access_token', accessToken);
                if (refreshToken) localStorage.setItem('refresh_token', refreshToken);

                var user = result.body.user || {};
                if (user.id)    localStorage.setItem('user_id',    user.id);
                if (user.email) localStorage.setItem('user_email', user.email);
                localStorage.setItem('first_name', user.first_name || '');
                localStorage.setItem('last_name',  user.last_name  || '');
                localStorage.setItem('country',    user.country    || '');
                localStorage.setItem('auth_just_signed_in_at', String(Date.now()));

                // ── 5. Hydrate profile from /api/auth/me then redirect ───────
                fetch('/api/auth/me', {
                    headers: { 'Authorization': 'Bearer ' + accessToken }
                })
                .then(function (r) { return r.json().catch(function () { return {}; }); })
                .then(function (meData) {
                    if (meData && meData.success && meData.user) {
                        var u = meData.user;
                        if (u.id)    localStorage.setItem('user_id',    u.id);
                        if (u.email) localStorage.setItem('user_email', u.email);
                        if (u.first_name) localStorage.setItem('first_name', u.first_name);
                        if (u.last_name)  localStorage.setItem('last_name',  u.last_name);
                        if (u.country)    localStorage.setItem('country',    u.country);
                    }
                })
                .catch(function () {})
                .finally(function () {
                    titleEl.className = 'ok';
                    titleEl.textContent = 'Sign-in successful';
                    messageEl.textContent = 'Redirecting to dashboard...';
                    setTimeout(function () { window.location.replace('/'); }, 400);
                });
            })
            .catch(function (err) {
                clearAuthStorage();
                showError('Sign-in error', String(err && err.message ? err.message : err));
            });
        })();
    </script>
</body>
</html>
