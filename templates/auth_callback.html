<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Verifying Account...</title>
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='branding/favicon.svg') }}">
    <style>
        body {
            margin: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #f6f8fb;
            color: #1f2937;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
        }
        .card {
            background: white;
            width: 92%;
            max-width: 520px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.08);
            padding: 28px;
            text-align: center;
        }
        .brand-logo {
            width: 160px;
            height: 34px;
            display: block;
            margin: 0 auto 14px;
            object-fit: contain;
        }
        h1 {
            margin: 0 0 10px;
            font-size: 22px;
        }
        p {
            margin: 0;
            color: #4b5563;
            line-height: 1.5;
        }
        .ok {
            color: #166534;
        }
        .err {
            color: #991b1b;
        }
        .hint {
            margin-top: 14px;
            font-size: 13px;
            color: #6b7280;
        }
        a {
            color: #2563eb;
            text-decoration: none;
        }
    </style>
</head>
<body>
    <div class="card">
        <img class="brand-logo" src="{{ url_for('static', filename='branding/velank-logo-dark.svg') }}" alt="Velank logo">
        <h1 id="title">Verifying your account...</h1>
        <p id="message">Please wait while we finish your sign-in.</p>
        <p class="hint">If this takes too long, <a href="/login">go to login</a>.</p>
    </div>

    <script>
        (function () {
            const titleEl = document.getElementById('title');
            const messageEl = document.getElementById('message');

            function isLikelyJwt(token) {
                const value = String(token || '').trim();
                if (!value) return false;
                return value.split('.').length === 3;
            }

            async function postJson(url, payload) {
                const response = await fetch(url, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload || {})
                });
                let data = {};
                try {
                    data = await response.json();
                } catch (_) {
                    data = {};
                }
                return { response, data };
            }

            async function verifyOrRefreshSession(accessToken, refreshToken) {
                if (!accessToken) {
                    return false;
                }

                const verify = await postJson('/api/auth/verify-token', { token: accessToken });
                if (verify.response.ok && verify.data && verify.data.success) {
                    return true;
                }

                if (!refreshToken) {
                    return false;
                }

                const refreshed = await postJson('/api/auth/refresh', { refresh_token: refreshToken });
                if (!refreshed.response.ok || !refreshed.data || !refreshed.data.success || !refreshed.data.access_token) {
                    return false;
                }

                localStorage.setItem('access_token', refreshed.data.access_token);
                if (refreshed.data.refresh_token) {
                    localStorage.setItem('refresh_token', refreshed.data.refresh_token);
                }

                const recheck = await postJson('/api/auth/verify-token', { token: refreshed.data.access_token });
                return Boolean(recheck.response.ok && recheck.data && recheck.data.success);
            }

            async function hydrateUserProfile() {
                const accessToken = localStorage.getItem('access_token');
                if (!accessToken) {
                    return;
                }

                try {
                    const response = await fetch('/api/auth/me', {
                        headers: {
                            'Authorization': `Bearer ${accessToken}`
                        }
                    });
                    const data = await response.json().catch(function () { return {}; });
                    if (!response.ok || !data || !data.success || !data.user) {
                        return;
                    }

                    if (data.user.id) localStorage.setItem('user_id', data.user.id);
                    if (data.user.email) localStorage.setItem('user_email', data.user.email);
                    localStorage.setItem('first_name', data.user.first_name || '');
                    localStorage.setItem('last_name', data.user.last_name || '');
                    localStorage.setItem('country', data.user.country || '');
                } catch (_) {}
            }

            const hashParams = new URLSearchParams(window.location.hash.replace(/^#/, ''));
            const queryParams = new URLSearchParams(window.location.search || '');

            const accessToken = hashParams.get('access_token') || queryParams.get('access_token');
            const refreshToken = hashParams.get('refresh_token') || queryParams.get('refresh_token');
            const tokenType = hashParams.get('token_type') || queryParams.get('token_type');
            const actionType = hashParams.get('type') || queryParams.get('type');
            const oauthError = hashParams.get('error_description') || queryParams.get('error_description') || hashParams.get('error') || queryParams.get('error');

            if (oauthError) {
                ['access_token', 'refresh_token', 'user_id', 'user_email', 'first_name', 'last_name', 'country', 'auth_just_signed_in_at']
                    .forEach(function (key) { localStorage.removeItem(key); });
                titleEl.className = 'err';
                titleEl.textContent = 'Google sign-in failed';
                messageEl.textContent = String(oauthError).replace(/\+/g, ' ').trim();
                setTimeout(function () {
                    window.location.replace('/login#oauth_error=' + encodeURIComponent(String(oauthError)));
                }, 1400);
                return;
            }

            if (accessToken) {
                localStorage.setItem('access_token', accessToken);
                if (refreshToken) localStorage.setItem('refresh_token', refreshToken);
                if (tokenType) localStorage.setItem('token_type', tokenType);

                titleEl.className = 'ok';
                titleEl.textContent = 'Completing sign-in...';
                messageEl.textContent = 'Validating your session. Please wait.';

                verifyOrRefreshSession(accessToken, refreshToken)
                    .then(function (ok) {
                        if (!ok) {
                            titleEl.className = 'err';
                            titleEl.textContent = 'Sign-in could not be completed';
                            messageEl.textContent = isLikelyJwt(accessToken)
                                ? 'Session validation failed. Please try Google sign-in once more.'
                                : 'Received a non-app token from OAuth callback. Please retry sign-in.';
                            localStorage.removeItem('access_token');
                            localStorage.removeItem('refresh_token');
                            return;
                        }

                        titleEl.className = 'ok';
                        titleEl.textContent = 'Sign-in successful';
                        messageEl.textContent = 'Redirecting to dashboard...';
                        localStorage.setItem('auth_just_signed_in_at', String(Date.now()));
                        hydrateUserProfile().finally(function () {
                            setTimeout(function () {
                                window.location.replace('/');
                            }, 450);
                        });
                    })
                    .catch(function () {
                        titleEl.className = 'err';
                        titleEl.textContent = 'Sign-in could not be completed';
                        messageEl.textContent = 'Session validation failed due to a network error. Please try again.';
                        localStorage.removeItem('access_token');
                        localStorage.removeItem('refresh_token');
                        localStorage.removeItem('auth_just_signed_in_at');
                    });
                return;
            }

            titleEl.className = 'err';
            titleEl.textContent = 'Verification link opened';
            if (actionType === 'signup') {
                messageEl.textContent = 'No session token was found in this link. Please go to login and sign in manually.';
            } else {
                messageEl.textContent = 'Could not capture session from URL. Please log in again.';
            }
        })();
    </script>
</body>
</html>
