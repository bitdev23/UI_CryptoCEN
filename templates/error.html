<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{ error_code }} — Velank AI</title>
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='branding/favicon.svg') }}">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #0c0e14;
            color: #e2e4ea;
            overflow: hidden;
        }
        /* animated gradient orbs */
        body::before, body::after {
            content: '';
            position: fixed;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.18;
            pointer-events: none;
            z-index: 0;
        }
        body::before {
            width: 520px; height: 520px;
            top: -120px; left: -80px;
            background: radial-gradient(circle, #6366f1, transparent 70%);
            animation: floatA 14s ease-in-out infinite alternate;
        }
        body::after {
            width: 440px; height: 440px;
            bottom: -100px; right: -60px;
            background: radial-gradient(circle, #8b5cf6, transparent 70%);
            animation: floatB 16s ease-in-out infinite alternate;
        }
        @keyframes floatA { to { transform: translate(60px, 40px) scale(1.1); } }
        @keyframes floatB { to { transform: translate(-50px, -30px) scale(0.95); } }

        .error-container {
            position: relative;
            z-index: 1;
            text-align: center;
            max-width: 520px;
            padding: 2.5rem;
        }
        .error-code {
            font-family: 'Syne', sans-serif;
            font-size: 7rem;
            font-weight: 800;
            line-height: 1;
            background: linear-gradient(135deg, #6366f1 0%, #a78bfa 50%, #8b5cf6 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
            margin-bottom: 0.5rem;
            letter-spacing: -3px;
        }
        .error-title {
            font-family: 'Syne', sans-serif;
            font-size: 1.5rem;
            font-weight: 700;
            color: #f1f2f6;
            margin-bottom: 0.75rem;
        }
        .error-message {
            font-size: 0.95rem;
            color: rgba(255,255,255,0.5);
            line-height: 1.6;
            margin-bottom: 2rem;
        }
        .error-actions {
            display: flex;
            gap: 0.75rem;
            justify-content: center;
            flex-wrap: wrap;
        }
        .btn-error {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.7rem 1.5rem;
            border-radius: 10px;
            font-size: 0.88rem;
            font-weight: 600;
            text-decoration: none;
            transition: all 0.2s ease;
            cursor: pointer;
            border: none;
        }
        .btn-primary-err {
            background: linear-gradient(135deg, #6366f1, #8b5cf6);
            color: #fff;
            box-shadow: 0 4px 20px rgba(99,102,241,0.3);
        }
        .btn-primary-err:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 28px rgba(99,102,241,0.45);
        }
        .btn-secondary-err {
            background: rgba(255,255,255,0.06);
            color: rgba(255,255,255,0.7);
            border: 1px solid rgba(255,255,255,0.1);
        }
        .btn-secondary-err:hover {
            background: rgba(255,255,255,0.1);
            color: #fff;
        }
        .error-footer {
            margin-top: 2.5rem;
            font-size: 0.78rem;
            color: rgba(255,255,255,0.25);
        }
    </style>
    <link href="https://fonts.googleapis.com/css2?family=Syne:wght@700;800&family=DM+Sans:wght@400;500;600&display=swap" rel="stylesheet">
</head>
<body>
    <div class="error-container">
        <div class="error-code">{{ error_code }}</div>
        <h1 class="error-title">{{ error_title }}</h1>
        <p class="error-message">{{ error_message }}</p>
        <div class="error-actions">
            <a href="/" class="btn-error btn-primary-err">
                <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9l5-5 5 5"/><path d="M8 4v12"/></svg>
                Go to Dashboard
            </a>
            <button onclick="history.back()" class="btn-error btn-secondary-err">
                <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><path d="M12 19l-7-7 7-7"/></svg>
                Go Back
            </button>
        </div>
        <div class="error-footer">Velank AI &middot; If this keeps happening, contact support.</div>
    </div>
</body>
</html>
