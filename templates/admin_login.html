<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Velank Admin Login</title>
    <link rel="icon" type="image/svg+xml" href="{{ url_for('static', filename='branding/favicon.svg') }}">
    <style>
        body { margin: 0; font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: linear-gradient(135deg,#111827,#1f2937); color:#e5e7eb; min-height:100vh; display:flex; align-items:center; justify-content:center; }
        .card { width: 92%; max-width: 420px; background:#111827; border:1px solid #374151; border-radius:14px; padding:24px; box-shadow:0 20px 40px rgba(0,0,0,.35); }
        .brand-logo { width: 150px; height: 34px; display:block; margin:0 auto 12px; object-fit: contain; }
        h1 { margin:0 0 8px; font-size:24px; }
        p { margin:0 0 18px; color:#9ca3af; }
        label { display:block; margin:12px 0 6px; font-size:14px; color:#cbd5e1; }
        input { width:100%; padding:10px 12px; border-radius:10px; border:1px solid #374151; background:#0f172a; color:#e5e7eb; }
        button { width:100%; margin-top:16px; padding:11px 12px; border:0; border-radius:10px; background:#2563eb; color:#fff; font-weight:700; cursor:pointer; }
        button:hover { background:#1d4ed8; }
        .msg { margin-top:12px; font-size:13px; min-height:18px; }
        .err { color:#fca5a5; }
        a { color:#93c5fd; text-decoration:none; }
    </style>
</head>
<body>
    <div class="card">
        <img class="brand-logo" src="{{ url_for('static', filename='branding/velank-logo-light.svg') }}" alt="Velank logo" />
        <h1>Admin Login</h1>
        <p>Sign in to access system overview and user controls.</p>
        <form id="admin-login-form">
            <label for="email">Admin Email</label>
            <input id="email" type="email" required />
            <label for="password">Password</label>
            <input id="password" type="password" required />
            <button type="submit">Sign In</button>
        </form>
        <div class="msg" id="msg"></div>
        <p style="margin-top:14px;"><a href="/login">Back to User Login</a></p>
    </div>

    <script>
        function getCsrfToken() {
            const match = document.cookie.match(/(?:^|;\s*)csrf_token=([^;]*)/);
            return match ? decodeURIComponent(match[1]) : '';
        }

        document.getElementById('admin-login-form').addEventListener('submit', async function (event) {
            event.preventDefault();
            const msg = document.getElementById('msg');
            msg.className = 'msg';
            msg.textContent = 'Signing in...';

            const payload = {
                email: document.getElementById('email').value.trim(),
                password: document.getElementById('password').value,
                csrf_token: getCsrfToken()
            };

            try {
                const response = await fetch('/admin/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
                const data = await response.json();
                if (!data.success) {
                    msg.className = 'msg err';
                    msg.textContent = data.message || 'Login failed';
                    return;
                }
                window.location.href = data.redirect || '/admin/dashboard';
            } catch (error) {
                msg.className = 'msg err';
                msg.textContent = error.message;
            }
        });
    </script>
</body>
</html>
