<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cg" x1="10%" y1="0%" x2="90%" y2="110%">
      <stop offset="0%" stop-color="#9f6ffd"/>
      <stop offset="55%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#5418c8"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0%" y1="0%" x2="55%" y2="80%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.26"/>
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0.0"/>
    </linearGradient>
    <linearGradient id="spk" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#e9d5ff"/>
    </linearGradient>
    <linearGradient id="cur" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#e9d5ff"/>
      <stop offset="100%" stop-color="#c084fc"/>
    </linearGradient>
  </defs>

  <!-- White container -->
  <rect x="0" y="0" width="100" height="100" rx="22" fill="#ffffff"/>

  <!-- Card mark — well padded, centered -->
  <g transform="translate(12, 14)">
    <rect x="0" y="0" width="76" height="72" rx="10" fill="url(#cg)"/>
    <rect x="0" y="0" width="76" height="72" rx="10" fill="url(#sheen)"/>
    <rect x="0" y="0" width="76" height="72" rx="10" fill="none" stroke="#b49dff" stroke-width="0.75" opacity="0.3"/>

    <!-- Schedule badge top-left -->
    <rect x="6" y="6" width="22" height="7" rx="3.5" fill="white" opacity="0.18"/>
    <circle cx="11" cy="9.5" r="2" fill="#c4b5fd" opacity="0.9"/>
    <rect x="15" y="7.5" width="10" height="4" rx="2" fill="white" opacity="0.6"/>

    <!-- Spark top-right -->
    <path d="M 62 8 L 65 13 L 68 8 L 65 3 Z" fill="url(#spk)" opacity="0.97"/>
    <path d="M 59 8 L 65 6 L 71 8 L 65 10 Z" fill="url(#spk)" opacity="0.97"/>
    <circle cx="65" cy="8" r="2" fill="white" opacity="0.95"/>

    <!-- Content lines -->
    <rect x="6" y="22" width="64" height="6" rx="3" fill="white" opacity="0.95"/>
    <rect x="6" y="32" width="64" height="5" rx="2.5" fill="white" opacity="0.60"/>
    <rect x="6" y="41" width="64" height="5" rx="2.5" fill="white" opacity="0.44"/>
    <rect x="6" y="50" width="38" height="5" rx="2.5" fill="white" opacity="0.26"/>
    <!-- Cursor -->
    <rect x="46" y="49.5" width="2" height="6" rx="1" fill="url(#cur)" opacity="0.95"/>

    <!-- Divider -->
    <line x1="6" y1="62" x2="70" y2="62" stroke="white" stroke-width="0.6" opacity="0.12"/>

    <!-- Reaction dots -->
    <circle cx="12" cy="67" r="3.5" fill="white" opacity="0.20"/>
    <circle cx="20" cy="67" r="3.5" fill="white" opacity="0.14"/>
    <circle cx="28" cy="67" r="3.5" fill="white" opacity="0.09"/>

    <!-- Empty pill -->
    <rect x="42" y="62.5" width="28" height="10" rx="5" fill="white" opacity="0.18"/>
    <rect x="42" y="62.5" width="28" height="10" rx="5" fill="none" stroke="white" stroke-width="0.5" opacity="0.28"/>
  </g>
</svg>
