name: Generation Quality Suite

on:
  push:
    branches: [ "main" ]
    paths:
      - "benchmarks/**"
      - ".github/workflows/generation_quality_ci.yml"
  pull_request:
    branches: [ "main" ]
    paths:
      - "benchmarks/**"
      - ".github/workflows/generation_quality_ci.yml"
  workflow_dispatch:
    inputs:
      responses_file:
        description: "Optional benchmark responses file path"
        required: false
        default: "benchmarks/results/sample_outputs.json"

jobs:
  benchmark:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Select responses input
        id: responses
        run: |
          INPUT_FILE="${{ github.event.inputs.responses_file }}"
          if [ -n "$INPUT_FILE" ] && [ -f "$INPUT_FILE" ]; then
            echo "path=$INPUT_FILE" >> "$GITHUB_OUTPUT"
          elif [ -f "benchmarks/results/latest_generation_outputs.json" ]; then
            echo "path=benchmarks/results/latest_generation_outputs.json" >> "$GITHUB_OUTPUT"
          else
            echo "path=benchmarks/results/sample_outputs.json" >> "$GITHUB_OUTPUT"
          fi

      - name: Run generation quality benchmark
        run: |
          python benchmarks/run_generation_quality_bench.py \
            --suite benchmarks/generation_quality_suite.sample.json \
            --responses "${{ steps.responses.outputs.path }}" \
            --output benchmarks/results/generation_quality_report.ci.json \
            --min-pass-rate 80

      - name: Upload quality report
        uses: actions/upload-artifact@v4
        with:
          name: generation-quality-report
          path: benchmarks/results/generation_quality_report.ci.json
